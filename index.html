<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ustalarımız</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#ffffff; --card:#ffffff; --text:#0a2540; --muted:#5b6b7a;
      --line:#e7e5ee; --btn:#5009D9; --btn2:#efeafb;
      --radius:18px; --shadow:0 10px 30px -22px rgba(10,37,64,.4);
      font-family:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; background:#ffffff; color:var(--text); }
    .wrap{ max-width:1280px; margin:0 auto; padding:0 16px 40px; }
    h1{ font-size:28px; margin:0 0 6px; letter-spacing:-.02em; color:#0a2540; font-weight:800; }
    .sub{ color:#46586a; margin:0; line-height:1.45; max-width:68ch; }

    .panel{
      margin-top:16px; background:#f5f5f5;
      border:1px solid var(--line); border-radius:20px;
      display:flex; flex-direction:column;
    }
    .controls{
      flex:0 0 auto; padding:18px; display:grid;
      grid-template-columns:1fr 1fr 1.6fr; gap:12px;
      border-bottom:1px solid var(--line); background:#f5f5f5;
      border-top-left-radius:20px; border-top-right-radius:20px;
    }
    @media (max-width:900px){ .controls{ grid-template-columns:1fr 1fr; } }
    @media (max-width:520px){ .controls{ grid-template-columns:1fr; } }
    .field{ display:flex; flex-direction:column; gap:6px; }
    label{ font-size:13px; font-weight:700; color:var(--muted); }
    select, input{
      background:#fff; color:var(--text); font-family:"Nunito"; font-size:15px; font-weight:600;
      border:1px solid #d9dde6; border-radius:12px; padding:12px 14px; outline:none;
    }
    input{ font-weight:500; }
    input::placeholder{ color:#9aa7b5; font-weight:500; }
    select:focus, input:focus{ border-color:#5009D9; box-shadow:0 0 0 3px rgba(80,9,217,.12); }

    .bar{
      flex:0 0 auto; display:flex; gap:10px; align-items:center;
      padding:14px 18px; flex-wrap:wrap; border-bottom:1px solid var(--line); background:#f5f5f5;
    }
    .chip{
      font-size:14px; color:var(--muted); border:1px solid var(--line);
      padding:10px 16px; border-radius:11px; display:flex; gap:8px; align-items:center; background:#fff; font-weight:600;
    }
    .chip b{ color:var(--text); font-weight:800; }
    .btn{
      cursor:pointer; border:1px solid transparent; border-radius:11px; padding:11px 20px;
      background:var(--btn); color:#fff; font-family:"Nunito"; font-weight:800; font-size:14px;
    }
    .btn.secondary{ background:var(--btn2); color:#5009D9; border:1px solid #e0d9f7; }
    .btn:hover{ filter:brightness(.97); }
    .btn:active{ transform:translateY(1px); }
    .grow{ flex:1; }

    .list{
      flex:1 1 auto; padding:18px;
      display:grid; grid-template-columns:1fr 1fr; gap:16px;
    }
    @media (max-width:900px){ .list{ grid-template-columns:1fr; } }

    .card{
      background:#fff; border:1px solid var(--line);
      border-radius:var(--radius); padding:22px; box-shadow:var(--shadow);
    }
    .top{ display:flex; gap:10px; align-items:flex-start; justify-content:space-between; }
    .name{ font-size:19px; font-weight:800; margin:0; color:#0a2540; }
    .meta{ color:var(--muted); font-size:14px; margin:8px 0 0; line-height:1.5; }
    .meta b{ color:#0a2540; }
    .tags{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .tag{
      font-size:13px; color:var(--muted); border:1px solid #e0e0ea;
      padding:5px 14px; border-radius:999px; background:#fff; font-weight:700;
    }
    .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
    .a{
      text-decoration:none; display:inline-flex; gap:8px; align-items:center;
      padding:10px 22px; border-radius:11px; border:1px solid #e0d9f7;
      background:#efeafb; color:#5009D9; font-weight:800; font-size:14px;
    }
    .a.primary{ background:#5009D9; color:#fff; border-color:#5009D9; }
    .a.primary:hover{ background:#3d06a8; border-color:#3d06a8; }
    .a.ok{ background:#e9f7ee; color:#1b8a4e; border-color:rgba(27,138,78,.2); }

    .empty{
      grid-column:1 / -1; padding:48px 16px; color:var(--muted);
      text-align:center; border:1px solid var(--line); border-radius:16px; background:#fff; font-weight:600; display:none;
    }
  </style>
</head>

        <div class="field">

      </div>

      <div class="bar">
        <button class="btn secondary" id="sortAZ" title="Mağaza ismine göre A→Z">A → Z</button>
        <button class="btn secondary" id="sortZA" title="Mağaza ismine göre Z→A">Z → A</button>
        <div class="chip"><span>Sonuç:</span> <b id="count">0</b></div>
        <div class="grow"></div>
        <button class="btn" id="reset">Filtreleri Sıfırla</button>
      </div>

      <div id="list" class="list"></div>
      <div id="empty" class="empty">Kriterlere uygun sonuç bulunamadı.</div>
    </div>
  </div>

  const $ = (id) => document.getElementById(id);
  const norm = (s) => (s || "").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  function unique(arr){ return [...new Set(arr)].sort((a,b)=>a.localeCompare(b,"tr")); }

  const citySel = $("city"), districtSel = $("district"), qInp = $("q");
  const listEl = $("list"), emptyEl = $("empty"), countEl = $("count");

  function fillCities(){
    const cities = unique(DEALERS.map(d=>d.city));
    citySel.innerHTML = `<option value="">--Seçiniz--</option>` + cities.map(c=>`<option>${c}</option>`).join("");
  }
  function fillDistricts(){
    const city = citySel.value;
    const districts = unique(DEALERS.filter(d=>!city || d.city===city).map(d=>d.district));
    districtSel.innerHTML = `<option value="">--Seçiniz--</option>` + districts.map(c=>`<option>${c}</option>`).join("");
  }
  function mapsLink(d){
    if (typeof d.lat === "number" && typeof d.lng === "number") return `https://www.google.com/maps?q=${d.lat},${d.lng}`;
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.address)}`;
  }
  function phoneLink(phone){ const p=(phone||"").replace(/[^\d+]/g,""); return p?`tel:${p}`:""; }
  function escapeHtml(str){
    return (str||"").toString().replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  let currentSort = "AZ";
  function apply(){
    const city = citySel.value, district = districtSel.value, q = norm(qInp.value);
    let out = DEALERS.filter(d=>{
      if (city && d.city !== city) return false;
      if (district && d.district !== district) return false;
      if (!q) return true;
      const hay = norm([d.name, d.address, d.city, d.district, (d.tags||[]).join(" ")].join(" "));
      return hay.includes(q);
    });
    out.sort((a,b)=>{ const cmp=a.name.localeCompare(b.name,"tr"); return currentSort==="AZ"?cmp:-cmp; });
    render(out);
  }
  function render(items){
    countEl.textContent = items.length;
    listEl.innerHTML = "";
    if (!items.length){ emptyEl.style.display = "block"; return; }
    emptyEl.style.display = "none";
    listEl.innerHTML = items.map(d=>{
      const mapUrl = mapsLink(d), tel = phoneLink(d.phone);
      const tags = (d.tags||[]).slice(0,6).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("");
      return `
        <div class="card">
          <div class="top"><div>
            <p class="name">${escapeHtml(d.name)}</p>
            <p class="meta"><b>${escapeHtml(d.city)}</b> · ${escapeHtml(d.district)}<br/>${escapeHtml(d.address)}</p>
            ${tags ? `<div class="tags">${tags}</div>` : ``}
          </div></div>
          <div class="actions">
            ${tel ? `<a class="a ok" href="${tel}">Ara</a>` : ``}
            <a class="a" href="${mapUrl}" target="_blank" rel="noopener">Yol Tarifi</a>
          </div>
        </div>`;
    }).join("");
  }

  citySel.addEventListener("change", ()=>{ fillDistricts(); apply(); });
  districtSel.addEventListener("change", apply);
  qInp.addEventListener("input", apply);
  $("sortAZ").addEventListener("click", ()=>{ currentSort="AZ"; apply(); });
  $("sortZA").addEventListener("click", ()=>{ currentSort="ZA"; apply(); });
  $("reset").addEventListener("click", ()=>{
    citySel.value=""; fillDistricts(); districtSel.value=""; qInp.value=""; currentSort="AZ"; apply();
  });

  fillCities(); fillDistricts(); apply();
</script>

<script>
  function mxPost(){ parent.postMessage({mxHeight:document.documentElement.scrollHeight},'*'); }
  window.addEventListener('load',mxPost);
  new ResizeObserver(mxPost).observe(document.body);
</script>
</body>
</html>
